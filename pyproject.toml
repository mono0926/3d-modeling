[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mono-3d-modeling"
version = "0.1.0"
description = "Parametric 3D modeling workspace with build123d and CadQuery"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["steel_rack_base_hook*"]
